id: binance_p2p
name: Binance P2P
display_name: Binance P2P
category: cex_p2p
subcategory: in-app peer-to-peer offer book
website: https://p2p.binance.com
launched: '2019-10'

description: >-
  Binance P2P is a peer-to-peer marketplace that allows users to directly exchange
  cryptocurrencies with other Binance users using fiat currency and local payment
  methods. The platform facilitates the exchange through an escrow service, holding
  assets until both parties confirm the trade, and arbitrates disputes when they don't.

links:
  website: https://p2p.binance.com
  twitter: https://twitter.com/binance
  docs: https://www.binance.com/en/support/faq/c2c-trading

legal_entity: Multiple regional Binance entities
# Regulatory registry, hand-verified 2026-07-21 (manual provenance — re-check urls
# when touching). NOTE: the former FR PSAN / ES VASP national registrations lost
# force at the MiCA transition; Binance holds NO MiCA CASP authorization and halted
# EU services from 2026-07-01 after withdrawing its Greek HCMC application.
licenses:
  - jurisdiction: Dubai (UAE)
    type: VASP licence
    authority: Virtual Assets Regulatory Authority (VARA)
    status: active
    since: '2024-04'
    url: https://www.vara.ae/en/licenses-and-register/public-register/binance-fze/
  - jurisdiction: Abu Dhabi (ADGM)
    type: Recognised Investment Exchange + broker-dealer (Nest entities)
    authority: Financial Services Regulatory Authority (FSRA)
    status: active
    since: '2026-01'
    url: https://www.adgm.com/media/announcements/binance-becomes-first-crypto-exchange-to-secure-a-global-license-under-adgm-framework-setting-a-new-standard-in-digital-asset-regulation
  - jurisdiction: EU/EEA
    type: MiCA CASP authorization
    status: none
    note: >-
      Withdrew its Greek HCMC application 2026-06-24 and halted services across EU
      member states from 2026-07-01; states it intends to reapply in another member
      state. Former national registrations (FR PSAN, ES VASP) lapsed with the MiCA
      transition.
    url: https://www.coindesk.com/policy/2026/06/26/binance-tells-eu-users-it-will-no-longer-provide-services-after-failing-to-secure-mica-license

direction: both
countries_supported: []
fiats: [USD, EUR, GBP, NGN, INR, BRL, ARS, TRY, VND, PHP, IDR, RUB]
assets:
  - { symbol: USDT, chain: multiple }
  - { symbol: BTC, chain: bitcoin }
  - { symbol: ETH, chain: ethereum }
  - { symbol: USDC, chain: multiple }
  - { symbol: BNB, chain: bsc }
  - { symbol: FDUSD, chain: ethereum }
payment_methods: [bank_wire, sepa, p2p_local, cash]
# Binance P2P settlement is OFF-CHAIN: the escrow releases to the buyer's USDT balance
# on Binance's internal ledger. Withdrawal to a self-custodial wallet is a separate
# post-settlement action; the user picks any chain Binance supports for that asset.
# Withdrawal options for reference (NOT settlement chains):
#   ethereum, bitcoin, bsc, tron, solana, polygon, arbitrum, optimism, avalanche, base
delivery_chains: [offchain]

kyc_tiers:
  - { name: Verified, requirements: [id], min: 0, max: null, period: daily }
  - { name: Verified Plus, requirements: [id, poa], min: 0, max: null, period: daily }
non_kyc_available: false
pii_floor: id

pricing:
  spread_method: marketmaker_quote
  pricing_endpoint: https://p2p.binance.com/bapi/c2c/v2/friendly/c2c/adv/search
  # venue_fee restored 2026-07-21 (reverses the 2026-05-20 removal): the taker DOES
  # pay a separately-itemized venue charge on top of the maker's quoted price — a flat
  # 0.06-0.08 USDT per trade order on USDT pairs in ~97 fiat markets (0.05 from
  # 2024-03-19, adjusted 2025-09-22). The May removal assumed takers paid nothing.
  # See snapshot.cost_1k assumptions for the sourced per-leg breakdown.
  layers: [maker_quote, venue_fee]

settlement_time:
  value: { p2p_local: 15min-2h }
  provenance: self_reported
  last_verified: '2026-05-05'

delivery_custody: hosted
requires_account: true
wallet_setup_required: false

audits: []
open_source:
  is_open: false
proof_of_reserves:
  exists: true
  url: https://www.binance.com/en/proof-of-reserves
team_transparency: public

integration_types: [rest_api]
sdks: []
kyc_inheritance: none
white_label: no
webhooks: false
sandbox: false
docs_url: https://binance-docs.github.io/apidocs/spot/en/

address_linkage: internal
third_party_sharing:
  shares: true
  partners: [law enforcement, regional regulators]
onchain_privacy: none
