id: ramp_network
name: Ramp Network
category: ramp
subcategory: integrator-friendly on/off-ramp
website: https://ramp.network
launched: '2017'

description: >-
  Ramp Network is a hosted fiat ↔ crypto onramp embedded across 600+ wallets and
  dApps. Ramp itself prices each route: the displayed rate is a single all-in
  quote bundling Ramp's spread, the payment-method fee, and any applicable tax —
  there's no maker price to compare against.

legal_entity: Ramp Swaps Ltd (UK), with EU subsidiaries
licenses:
  - { jurisdiction: GB, type: FCA registered cryptoasset firm }
  - { jurisdiction: IE, type: VASP }
  - { jurisdiction: US, type: MTL (partial state coverage) }

direction: both
countries_supported: []
fiats: [USD, EUR, GBP, AUD, CAD, JPY, BRL, MXN]
assets:
  - { symbol: USDC, chain: ethereum }
  - { symbol: USDC, chain: base }
  - { symbol: USDC, chain: polygon }
  - { symbol: ETH, chain: ethereum }
  - { symbol: BTC, chain: bitcoin }
# Buy-side payment methods only. Sell-side adds ACH / RTP / SEPA / SPEI / card-out
# (Visa & Mastercard) but those don't enable purchases. Per Ramp docs 2026-05-17.
payment_methods: [card, apple_pay, google_pay, manual_bank_transfer, auto_bank_transfer, pix]
delivery_chains: [ethereum, polygon, arbitrum, optimism, base, solana, avalanche]

# Per Ramp Pricing Policy (https://rampnetwork.com/pricing-policy), every purchase
# requires KYC. Tiers below are the US/EU ladder; "Global (rest of world)" has slightly
# higher thresholds (PoA at €5k, SoW at €15k, SoF at €30k).
kyc_tiers:
  - { name: ID, requirements: [id, selfie], min: 0, max: 5000, period: lifetime }
  - { name: ID + PoA, requirements: [id, selfie, poa], min: 5000, max: 10000, period: lifetime }
  - { name: ID + PoA + SoW, requirements: [id, selfie, poa, sow], min: 10000, max: 20000, period: lifetime }
  - { name: Full (ID + PoA + SoW + SoF), requirements: [id, selfie, poa, sow, sof], min: 20000, max: null, period: lifetime }
non_kyc_available: false
pii_floor: id

pricing:
  spread_method: vs_mid
  pricing_endpoint: https://api.rampnetwork.com/api/host-api/v3/onramp/quote/all
  layers: [venue_quote, venue_fee]

settlement_time:
  value: { card: instant, sepa: 1-2d, ach: 1-3d }
  provenance: self_reported
  last_verified: '2026-05-05'

chargeback_protection: true

delivery_custody: self
requires_account: false
wallet_setup_required: true

audits: []
open_source:
  is_open: false
team_transparency: public

integration_types: [widget, rest_api, sdk, hosted_checkout]
sdks:
  - { platform: web, url: https://github.com/RampNetwork/ramp-instant-sdk }
kyc_inheritance: none
white_label: yes
webhooks: true
sandbox: true
docs_url: https://docs.rampnetwork.com
integrator_fee_model: rev_share

address_linkage: shared_with_partners
third_party_sharing:
  shares: true
  partners: [KYC providers, payment processors, blockchain analytics]
onchain_privacy: none
