name: snapshot

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore liquidity logs from data branch
        # The runner starts from a fresh main checkout where data/charts/ is gitignored.
        # The self-accumulating liquidity logs live on the `data` branch — pull them down
        # so `npm run snapshot` can read prior entries, dedupe by day, and append today's.
        # Without this step the log file would be overwritten with a single-entry version
        # on every cron run, destroying the historical series.
        run: |
          set -e
          git fetch origin data --depth=1 || true
          mkdir -p data/charts
          for id in zkp2p binance_p2p ramp_network kraken_otc; do
            git show origin/data:charts/${id}_active_liquidity.json > data/charts/${id}_active_liquidity.json 2>/dev/null || true
          done
          ls -la data/charts/ || true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run snapshot
        env:
          ZKP2P_ANALYTICS_KEY: ${{ secrets.ZKP2P_ANALYTICS_KEY }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
        run: npm run snapshot
      - name: Commit to data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "hip3-bot"
          git config user.email "hip3-bot@users.noreply.github.com"
          git fetch origin data
          git worktree add /tmp/data-branch origin/data
          mkdir -p /tmp/data-branch/snapshots /tmp/data-branch/charts
          cp -r data/snapshots/* /tmp/data-branch/snapshots/
          # Self-accumulating liquidity logs need to survive across cron runs.
          cp -r data/charts/*_active_liquidity.json /tmp/data-branch/charts/ 2>/dev/null || true
          cd /tmp/data-branch
          git checkout -B data
          git add snapshots charts
          git diff --cached --quiet && exit 0
          git commit -m "snapshot: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin data
