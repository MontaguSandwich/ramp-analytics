name: snapshot

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Restore liquidity logs from data branch
        # The runner starts from a fresh main checkout where data/charts/ is gitignored.
        # The self-accumulating liquidity logs live on the `data` branch — pull them down
        # so `npm run snapshot` can read prior entries, dedupe by day, and append today's.
        # Without this step the log file would be overwritten with a single-entry version
        # on every cron run, destroying the historical series.
        run: |
          set -e
          git fetch origin data --depth=1 || true
          mkdir -p data/charts
          for id in zkp2p binance_p2p ramp_network; do
            # Restore via mktemp + non-empty check — otherwise `> file 2>/dev/null || true`
            # creates a zero-byte file when the source doesn't exist on the data branch,
            # which then gets committed back as an empty log.
            tmp=$(mktemp)
            if git show "origin/data:charts/${id}_active_liquidity.json" > "$tmp" 2>/dev/null && [ -s "$tmp" ]; then
              mv "$tmp" "data/charts/${id}_active_liquidity.json"
            else
              rm -f "$tmp"
            fi
          done
          ls -la data/charts/ || true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run snapshot
        env:
          ZKP2P_ANALYTICS_KEY: ${{ secrets.ZKP2P_ANALYTICS_KEY }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
        run: npm run snapshot
      - name: Commit to data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "hip3-bot"
          git config user.email "hip3-bot@users.noreply.github.com"
          # Self-bootstrap: if origin/data doesn't exist yet, create it as an empty orphan.
          # Without this, the first run on a new repo fails because there's no data branch
          # to fetch and worktree from.
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data --depth=1
            git worktree add /tmp/data-branch origin/data
          else
            echo "data branch absent on remote — bootstrapping empty orphan"
            git worktree add --orphan -b data /tmp/data-branch
          fi
          mkdir -p /tmp/data-branch/snapshots /tmp/data-branch/charts
          cp -r data/snapshots/* /tmp/data-branch/snapshots/
          # Self-accumulating liquidity logs need to survive across cron runs.
          cp -r data/charts/*_active_liquidity.json /tmp/data-branch/charts/ 2>/dev/null || true
          cd /tmp/data-branch
          git checkout -B data
          git add snapshots charts
          git diff --cached --quiet && exit 0
          git commit -m "snapshot: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin data
      - name: Trigger Vercel redeploy
        # The data branch commit doesn't itself trigger Vercel (we configured
        # web/vercel.json to skip non-main builds). Vercel only bakes fresh
        # snapshot data into the deploy when main rebuilds — so we hit a deploy
        # hook here to kick off a main rebuild every cron tick. The build then
        # re-runs `npm run snapshot` and pulls the fresh active_liquidity logs
        # we just pushed to the data branch.
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL secret not set — skipping redeploy trigger"
            exit 0
          fi
          curl -fsSL -X POST "$VERCEL_DEPLOY_HOOK_URL" && echo "Vercel redeploy triggered"
